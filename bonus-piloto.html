<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KABOOM · Piloto de ronda bonus</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#11162c;color:#fcfafa;font:16px system-ui,sans-serif}
main{max-width:620px;margin:24px auto;padding:16px}
h1{margin:0 0 12px;color:#ffd962}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
button,select{font:inherit;color:inherit;background:#283660;border:1px solid #697cad;border-radius:12px;padding:10px}
button:enabled{cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid #80ffe2}
#arena{height:350px;position:relative;overflow:hidden;margin:14px 0;background:#182144;border-radius:16px}
.card{width:58px;height:68px;padding:0;position:absolute;top:0;left:0;background:transparent;border:0;perspective:650px;touch-action:manipulation}
.card:disabled{opacity:1}
.cardInner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.22,.8,.35,1)}
.cardFace{position:absolute;inset:0;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;border:2px solid #8196dd;border-radius:12px;backface-visibility:hidden}
.cardFront{background:linear-gradient(155deg,#294884,#241739);color:#ffe5a7;font-weight:900}
.cardBack{background:repeating-linear-gradient(135deg,#202c53 0 7px,#283967 7px 14px);color:#c2d5ff;transform:rotateY(180deg)}
.cardBack span{display:grid;place-items:center;border:1px solid #869ee0;border-radius:8px;width:100%;height:100%}
.card.flipped .cardInner{transform:rotateY(180deg)}
.card:enabled .cardFace{border-color:#ffd76d}
.card.arriving .cardInner{animation:cardArrival .42s ease-out both;animation-delay:var(--deal-delay)}
@keyframes cardArrival{from{opacity:0;transform:translateY(12px) scale(.89)}to{opacity:1;transform:none}}
#status{min-height:2.8em;margin-bottom:0}
#scoreboard{color:#a7f8e4}
.card.bonusDim{opacity:.28;transition:opacity .35s}
.card.bonusChosen{z-index:2;border-color:#ffdc7b;animation:bonusReveal .75s ease-out both}
.card.bonusChosen .cardFront{display:inline-block;animation:bonusLabel .55s ease-out both}
@keyframes bonusReveal{0%{box-shadow:0 0 0 0 #ffd66b}45%{box-shadow:0 0 24px 12px #ffbf4c66}100%{box-shadow:0 0 14px 3px #ffdf8177}}
@keyframes bonusLabel{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.card.bonusDim{transition:none}.card.bonusChosen,.card.bonusChosen .cardFront{animation:none}}
#chooseCountdown{min-height:1.5em;color:#ffe78b;font-weight:900;letter-spacing:.08em;text-align:center}
.card.bonusBlast{animation:bonusBlast .65s ease-out both}.card.bonusBlast .cardFace{background:#ffb83c;border-color:#fff3ac}
@keyframes bonusBlast{0%{opacity:1;box-shadow:0 0 0 0 #ffdb67}35%{opacity:1;box-shadow:0 0 24px 22px #ff773caa}100%{opacity:0;box-shadow:0 0 40px 42px #ff773c00}}
@media(prefers-reduced-motion:reduce){.card.bonusBlast{animation:none;opacity:.35}}
#bonusTitle{display:none}
body.embedded{overflow:hidden;background:radial-gradient(ellipse at center,#223765,#10172d 76%)}
body.embedded main{width:100%;height:100vh;max-width:none;margin:0;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
body.embedded h1,body.embedded .controls,body.embedded #scoreboard,body.embedded #chooseCountdown{display:none}
body.embedded #bonusTitle{display:block;margin:0;text-align:center;color:#ffd962;font-size:22px;font-size:clamp(16px,4vmin,34px);letter-spacing:.07em}
body.embedded #arena{flex:1;min-height:0;width:100%;max-width:960px;max-height:690px;margin:0;background:transparent}
body.embedded #status{position:absolute;width:1px;height:1px;min-height:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}
.card.bonusChosen .cardFront{display:grid}
@media(prefers-reduced-motion:reduce){.cardInner{transition:none}.card.arriving .cardInner{animation:none}}
</style>
<main>
<h2 id="bonusTitle">CHOOSE YOUR CARD</h2>
<h1>🃏 Ronda bonus</h1>
<div class="controls">
<label>Nivel <select id="level"><option>Fácil</option><option>Medio</option><option>Difícil</option><option>Máximo</option></select></label>

<button id="start">Probar ronda</button>
</div>
<div id="chooseCountdown" aria-hidden="true"></div><p id="status" role="status">Selecciona la dificultad y prueba la ronda.</p>
<div id="arena" aria-label="Cartas de la ronda bonus"></div>
<p id="scoreboard"></p>
</main>
<script>
(function(){
'use strict';
const element=id=>document.getElementById(id);
const arena=element('arena');
const config=new URLSearchParams(location.search);
const embedded=config.get('embedded')==='1'&&window.parent!==window;
function reportReward(reward){
 if(embedded)window.parent.postMessage({type:'kaboom-bonus-complete',reward},location.origin);
}
const controls=[element('level')];
const speed=Math.max(1,Math.min(20,Math.round(Number(config.get('speed'))||(config.get('fast')==='1'?20:10))));
const bombCount=9,columns=3,revealTimes=[5,4.5,4,3.5],shuffleTimes=[5,8,10,12],shufflePowers=[4,5,7,8];
const clock='clock',hand='hand',heart='heart';
let level=-1,itemsEnabled=false,score=0,inventory={},phase='idle',elapsed=0,moveElapsed=0,previousMoves=[],last=0,bombs=[];
function shuffle(values){
 const copy=values.slice();
 for(let i=copy.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  const value=copy[i];copy[i]=copy[j];copy[j]=value;
 }
 return copy;
}
function label(value){
 return value===clock?'⏱':value===hand?'✋':value===heart?'❤️':(value>0?'+':'')+value;
}
function show(message){element('status').textContent=message}
function updateScore(){
 element('scoreboard').textContent='Puntos: '+score+(itemsEnabled?' · ⏱ '+inventory.clock+' · ✋ '+inventory.hand+' · ❤️ '+inventory.heart:'');
}
function start(){
 const next=element('level').selectedIndex,nextItems=!embedded||config.get('items')==='1';
 if(next!==level||nextItems!==itemsEnabled){
  level=next;itemsEnabled=nextItems;score=0;
  inventory={clock:itemsEnabled?Math.ceil((4-level)/2):0,hand:itemsEnabled?Math.floor((4-level)/2):0,heart:0};
 }
 updateScore();arena.textContent='';element('chooseCountdown').textContent='';
 const total=bombCount;
 const pointPool=[50,100,200,-100,-200,50,100,200,-100];
 const itemRewards=itemsEnabled?shuffle([clock,hand,heart]).slice(0,2):[];
 const points=shuffle(pointPool).slice(0,total-itemRewards.length);
 if(!points.some(value=>value>0))points[0]=100;
 const rewards=shuffle(points.concat(itemRewards));
 bombs=rewards.map((reward,index)=>{
  const button=document.createElement('button');
  button.type='button';button.className='card arriving';button.disabled=true;
  button.innerHTML='<span class="cardInner" aria-hidden="true"><b class="cardFace cardFront"></b><span class="cardFace cardBack"><span>✦</span></span></span>';
  button.style.setProperty('--deal-delay',index*30+'ms');
  button.querySelector('.cardFront').textContent=label(reward);
  button.setAttribute('aria-label','Carta '+(index+1));
  button.onclick=()=>choose(reward,button);
  arena.appendChild(button);
  return {button,slot:index,from:index,to:index,bend:0};
 });
 controls.forEach(control=>control.disabled=true);
 element('start').disabled=true;
 phase='deal';elapsed=0;last=performance.now();previousMoves=[];paint(1,0);
 show('Memoriza los premios.');
 requestAnimationFrame(frame);
}
function move(){
 const slots=shuffle(Array.from({length:bombCount},(_,index)=>index));
 const next=Array.from({length:bombCount},(_,index)=>index);
 const groupSize=3+Math.floor(Math.random()*3);
 const group=slots.slice(0,groupSize);
 group.forEach((slot,index)=>{next[slot]=group[(index+1)%group.length]});
 const pair=slots.slice(groupSize,groupSize+2);
 if(Math.random()<.65&&previousMoves[pair[0]]!==pair[1]){
  next[pair[0]]=pair[1];next[pair[1]]=pair[0];
 }
 previousMoves=next;
 bombs.forEach(bomb=>{
  bomb.from=bomb.slot;
  bomb.to=next[bomb.slot];
  bomb.bend=Math.random()<.5?1:-1;
 });
 moveElapsed=0;
}
function paint(progress,drop){
 const width=arena.clientWidth,height=arena.clientHeight;
 const size=Math.max(20, Math.min(124,width/5.4,height/5.8));
 const cardHeight=size*1.17;
 const gap=Math.min(size*1.75,(width-size)/2);
 const rowGap=Math.min(cardHeight*1.55,(height-cardHeight)/2);
 const left=width/2-gap,top=height/2-rowGap;
 const eased=progress*progress*(3-2*progress);
 bombs.forEach(bomb=>{
  const fromX=left+(bomb.from%columns)*gap;
  const fromY=top+Math.floor(bomb.from/columns)*rowGap;
  const dx=((bomb.to%columns)-(bomb.from%columns))*gap;
  const dy=(Math.floor(bomb.to/columns)-Math.floor(bomb.from/columns))*rowGap;
  const distance=Math.sqrt(dx*dx+dy*dy)||1;
  const arc=Math.sin(Math.PI*progress)*Math.min(size*.42,24)*bomb.bend;
  const x=fromX+dx*eased-dy/distance*arc;
  const y=fromY+dy*eased+dx/distance*arc;
  bomb.button.style.width=size+'px';
  bomb.button.style.height=cardHeight+'px';
  bomb.button.style.fontSize=Math.max(11,size*.28)+'px';
  bomb.button.style.transform='translate3d('+(x-size/2)+'px,'+(y+drop*(height-y-cardHeight/2)-cardHeight/2)+'px,0)';
 });
}
function frame(now){
 if(phase==='idle'||phase==='result')return;
 const dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;
 if(phase==='deal'&&elapsed>=.68){
  bombs.forEach(card=>card.button.classList.remove('arriving'));
  phase='reveal';elapsed=0;
 }else if(phase==='reveal'&&elapsed>=revealTimes[level]){
  bombs.forEach(card=>card.button.classList.add('flipped'));
  phase='flip';elapsed=0;show('Volteando las cartas…');
 }else if(phase==='flip'&&elapsed>=.44){
  phase='shuffle';elapsed=0;move();show('Sigue la carta que elegiste.');
 }else if(phase==='shuffle'){
  const remaining=Math.ceil(shuffleTimes[level]-elapsed);
  const cue=remaining>=1&&remaining<=5?'CHOOSE IN '+remaining:'';
  if(element('chooseCountdown').textContent!==cue)element('chooseCountdown').textContent=cue;
  const progress=Math.min(1,elapsed/shuffleTimes[level]);
  const duration=Math.max(.64-(shufflePowers[level]-1)*(.41/9),1.22-progress*(level>=2?1.06:.91)-level*.035,1.08-(speed-1)*.86/19);
  moveElapsed+=dt/duration;
  paint(Math.min(1,moveElapsed),0);
  if(moveElapsed>=1){
   bombs.forEach(bomb=>bomb.slot=bomb.to);
   if(elapsed>=shuffleTimes[level]){
    phase='choose';elapsed=0;element('chooseCountdown').textContent='NOW!';show('Elige tu carta · 5 s');
    bombs.forEach(bomb=>bomb.button.disabled=false);
   }else move();
  }
 }else if(phase==='choose'){
  if(elapsed>=5){explodeAll();return}
  else{const message='Elige tu carta · '+Math.ceil(5-elapsed)+' s';if(element('status').textContent!==message)show(message)}
 }
 requestAnimationFrame(frame);
}
function choose(reward,button){
 if(phase!=='choose')return;
 element('chooseCountdown').textContent='';
 if(typeof reward==='number')score=Math.max(0,score+reward);
 else inventory[reward]++;
 phase='result';
 bombs.forEach(bomb=>{
  bomb.button.disabled=true;
  if(bomb.button!==button)bomb.button.classList.add('bonusDim');
 });
 button.classList.add('bonusChosen');
 button.classList.remove('flipped');
 button.setAttribute('aria-label','Premio: '+label(reward));
 show('Premio: '+label(reward));
 updateScore();
 setTimeout(()=>{
  phase='idle';
  controls.forEach(control=>control.disabled=false);
  element('start').disabled=false;
  reportReward(reward);
 },850);
}
function explodeAll(){
 phase='result';
 element('chooseCountdown').textContent='';
 bombs.forEach(bomb=>{
  bomb.button.disabled=true;
  bomb.button.classList.add('bonusBlast');
 });
 show('¡Tiempo agotado! Se perdieron los nueve premios.');
 setTimeout(()=>{
  phase='idle';arena.textContent='';
  controls.forEach(control=>control.disabled=false);
  element('start').disabled=false;
  reportReward(null);
 },650);
}
window.addEventListener('resize',()=>{if(phase==='choose'||phase==='result')paint(1,0)});
element('start').onclick=start;
if(embedded){
 document.body.classList.add('embedded');
 element('level').selectedIndex=Math.min(3,Math.max(0,Number(config.get('level'))||0));
 setTimeout(start,700);
}
})();
</script>
</html>
